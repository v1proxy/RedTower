# Shared core for every greenhouse node: Olimex ESP32-POE-ISO on wired PoE Ethernet (VLAN 10).
# Expects substitutions: node_name, friendly_name

esphome:
  name: ${node_name}
  friendly_name: ${friendly_name}
  project:
    name: redtower.greenhouse
    version: "1.0"

esp32:
  board: esp32-poe-iso
  framework:
    type: esp-idf

ethernet:
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk:
    pin: GPIO17
    mode: CLK_OUT
  phy_addr: 0
  power_pin: GPIO12

logger:
  level: INFO

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

time:
  # Local clock keeps schedules running even when Home Assistant is down.
  - platform: sntp
    id: sntp_time
    timezone: America/Chicago
    servers:
      - 192.168.10.1        # pfSense on the IoT VLAN (enable its NTP service)
      - 0.pool.ntp.org
      - 1.pool.ntp.org

sensor:
  - platform: uptime
    name: Uptime
    entity_category: diagnostic

binary_sensor:
  - platform: status
    name: Status

button:
  - platform: restart
    name: Restart
    entity_category: config
