# Greenhouse Tier C: 10 herbs (4.5 in pots)
# Flash once over USB, then OTA over the IoT VLAN.

substitutions:
  node_name: greenhouse-tier-c
  friendly_name: Greenhouse Tier C
  tier: "C"
  light_on_hour: "6"
  photoperiod_h: "16"
  light_max_pct: "100"

