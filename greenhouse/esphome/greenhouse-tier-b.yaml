sensor:
  # Zone watering decisions use the median, so one failed or dry-outlier probe cannot flood the tier.
  - platform: template
    id: median_moisture
    name: Median moisture
    unit_of_measurement: "%"
    device_class: moisture
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 60s
    lambda: |-
      std::vector<float> v = {id(b01_moisture).state, id(b02_moisture).state, id(b03_moisture).state, id(b04_moisture).state, id(b05_moisture).state, id(b06_moisture).state, id(b07_moisture).state, id(b08_moisture).state, id(b09_moisture).state, id(b10_moisture).state};
      v.erase(std::remove_if(v.begin(), v.end(), [](float f) { return std::isnan(f); }), v.end());
      if (v.size() < 3) return NAN;
      std::sort(v.begin(), v.end());
      size_t m = v.size() / 2;
      return (v.size() % 2) ? v[m] : (v[m - 1] + v[m]) / 2.0f;

  - platform: template
    name: Driest plant moisture
    unit_of_measurement: "%"
    device_class: moisture
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 60s
    lambda: |-
      std::vector<float> v = {id(b01_moisture).state, id(b02_moisture).state, id(b03_moisture).state, id(b04_moisture).state, id(b05_moisture).state, id(b06_moisture).state, id(b07_moisture).state, id(b08_moisture).state, id(b09_moisture).state, id(b10_moisture).state};
      float lo = NAN;
      for (float f : v) if (!std::isnan(f) && (std::isnan(lo) || f < lo)) lo = f;
      return lo;
