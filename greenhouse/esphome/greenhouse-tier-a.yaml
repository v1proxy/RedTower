# Greenhouse Tier A: 7 peppers (1 gal pots)
# Flash once over USB, then OTA over the IoT VLAN.

substitutions:
  node_name: greenhouse-tier-a
  friendly_name: Greenhouse Tier A
  tier: "A"
  light_on_hour: "6"
  photoperiod_h: "16"
  light_max_pct: "100"

packages:
  base: !include common/base.yaml
  tier: !include common/tier.yaml
  plant_a01: !include
    file: common/plant.yaml
    vars:
      pid: a01
      label: "A01"
      ads: ads_1
      mux: A0_GND
      dry_v: "2.20"     # calibrate
      wet_v: "1.00"     # calibrate
  plant_a02: !include
    file: common/plant.yaml
    vars:
      pid: a02
      label: "A02"
      ads: ads_1
      mux: A1_GND
      dry_v: "2.20"     # calibrate
      wet_v: "1.00"     # calibrate
  plant_a03: !include
    file: common/plant.yaml
    vars:
      pid: a03
      label: "A03"
      ads: ads_1
      mux: A2_GND
      dry_v: "2.20"     # calibrate
      wet_v: "1.00"     # calibrate
  plant_a04: !include
    file: common/plant.yaml
    vars:
      pid: a04
      label: "A04"
      ads: ads_1
      mux: A3_GND
      dry_v: "2.20"     # calibrate
      wet_v: "1.00"     # calibrate
  plant_a05: !include
    file: common/plant.yaml
    vars:
      pid: a05
      label: "A05"
      ads: ads_2
      mux: A0_GND
      dry_v: "2.20"     # calibrate
      wet_v: "1.00"     # calibrate
  plant_a06: !include
    file: common/plant.yaml
    vars:
      pid: a06
      label: "A06"
      ads: ads_2
      mux: A1_GND
      dry_v: "2.20"     # calibrate
      wet_v: "1.00"     # calibrate
  plant_a07: !include
    file: common/plant.yaml
    vars:
      pid: a07
      label: "A07"
      ads: ads_2
      mux: A2_GND
      dry_v: "2.20"     # calibrate
      wet_v: "1.00"     # calibrate

sensor:
  # Zone watering decisions use the median, so one failed or dry-outlier probe cannot flood the tier.
  - platform: template
    id: median_moisture
    name: Median moisture
    unit_of_measurement: "%"
    device_class: moisture
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 60s
    lambda: |-
      std::vector<float> v = {id(a01_moisture).state, id(a02_moisture).state, id(a03_moisture).state, id(a04_moisture).state, id(a05_moisture).state, id(a06_moisture).state, id(a07_moisture).state};
      v.erase(std::remove_if(v.begin(), v.end(), [](float f) { return std::isnan(f); }), v.end());
      if (v.size() < 3) return NAN;
      std::sort(v.begin(), v.end());
      size_t m = v.size() / 2;
      return (v.size() % 2) ? v[m] : (v[m - 1] + v[m]) / 2.0f;

  - platform: template
    name: Driest plant moisture
    unit_of_measurement: "%"
    device_class: moisture
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 60s
    lambda: |-
      std::vector<float> v = {id(a01_moisture).state, id(a02_moisture).state, id(a03_moisture).state, id(a04_moisture).state, id(a05_moisture).state, id(a06_moisture).state, id(a07_moisture).state};
      float lo = NAN;
      for (float f : v) if (!std::isnan(f) && (std::isnan(lo) || f < lo)) lo = f;
      return lo;
