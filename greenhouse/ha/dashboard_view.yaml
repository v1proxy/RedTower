# The Greenhouse view. Paste under views: in a dashboard's raw configuration editor.
# Resource first (Settings, Dashboards, Resources), as a JavaScript module:
#   /local/greenhouse/greenhouse-panel.js?v=0.9.0     copied by hand into config/www/greenhouse/
#   or the path HACS shows, when the card came from HACS
- title: Greenhouse
  path: greenhouse
  icon: mdi:sprout
  type: panel
  cards:
    - type: custom:greenhouse-panel
      demo: true        # simulated data. Remove this line once the real entities exist.
