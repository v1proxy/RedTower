# Gantry coordinates, machine millimetres after homing (FluidNC G53). Read by the gantry driver.
#
# PLACEHOLDERS. Every number below is computed from the drawing pitches (Tier A 188 mm, Tiers
# B and C 132 mm, pots centred on an assumed 1200 mm X travel), not measured. Commissioning
# step 9: home the gantry, jog to each pot, and write the real values here before the first
# route. The driver refuses any target outside "travel".
travel: {x_min: 0, x_max: 1200, z_min: 0, z_max: 1250}
park: {x: 0, z: 0}                 # where "home" returns to once homed
feed_mm_min: 3000                  # G1 feed for plant moves; the controller caps each axis itself

tiers:                             # carriage Z with the arm in the look pose for that tier
